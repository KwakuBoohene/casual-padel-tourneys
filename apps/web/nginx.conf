server {
    listen 3005;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location = /runtime-config.json { add_header Cache-Control "no-store" always; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Preserve direct tournament/career share links and refreshes.
    location / { try_files $uri $uri/ /index.html; }
}
